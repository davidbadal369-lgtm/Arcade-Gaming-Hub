<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktivní Desková Hra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- OBRAZOVKA NASTAVENÍ HRY -->
  <div id="setup-screen" class="screen active">
    <h1>Nastavení Hry</h1>

    <div class="setup-group">
      <label for="player-count">Počet hráčů:</label>
      <select id="player-count" onchange="updatePlayerSetup()">
        <option value="1">1 Hráč (Sólo režim)</option>
        <option value="2">2 Hráči</option>
        <option value="3">3 Hráči</option>
        <option value="4">4 Hráči</option>
      </select>
    </div>

    <!-- KONTEJNER PRO SOUPEŘE / PROFILY HRÁČŮ -->
    <div class="setup-group">
      <label>Profily hráčů:</label>
      <div id="players-config-container"></div>
    </div>

    <!-- MŘÍŽKA DLAŽDIC MINIHER -->
    <div class="setup-group">
      <label>Aktivní minihry (kliknutím zapni / vypni):</label>
      <div id="minigames-selection-container" class="minigames-grid"></div>
    </div>

    <button class="btn-primary" onclick="startGame()">Spustit Hru</button>
  </div>

  <!-- OBRAZOVKA SAMOTNÉ HRY -->
  <div id="game-screen" class="screen">
    <div class="header-info">
      <div>Na řadě je: <strong id="turn-player-name">-</strong></div>
      <div id="dice-result">Hodil jsi: -</div>
    </div>

    <button id="dice-btn" onclick="rollDice()">🎲 Hodit kostkou</button>

    <div class="board-container">
      <div id="board" class="board"></div>
    </div>
  </div>

  <!-- MODÁLNÍ OKNO MINIHRY -->
  <div id="minigame-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="minigame-title">Minihra</h2>
      <p id="minigame-desc"></p>
      <div id="minigame-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
