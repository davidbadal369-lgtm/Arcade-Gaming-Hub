<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktivní Desková Hra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NASTAVENÍ HRY (LOBBY) -->
  <div id="setup-screen" class="screen active">
    <h1>Nastavení Hry</h1>
    
    <div class="setup-group">
      <label for="player-count">Počet hráčů:</label>
      <select id="player-count" onchange="updatePlayerSetup()">
        <option value="1">1 Hráč (Sólo režim)</option>
        <option value="2" selected>2 Hráči</option>
        <option value="3">3 Hráči</option>
        <option value="4">4 Hráči</option>
      </select>
    </div>

    <div id="players-config-container">
      <!-- Zde se dynamicky vygenerují profily hráčů podle volby -->
    </div>

    <button class="btn-primary" onclick="startGame()">Spustit Hru</button>
  </div>

  <!-- HERNOSTNÍ DESKA -->
  <div id="game-screen" class="screen">
    <div class="header-info">
      <div id="current-turn-indicator">Na řadě je: <span id="turn-player-name">-</span></div>
      <button id="dice-btn" onclick="rollDice()">🎲 Hodit kostkou</button>
      <div id="dice-result"></div>
    </div>

    <div class="board-container">
      <div id="board" class="board">
        <!-- Herní políčka budou vygenerována pomocí JS -->
      </div>
    </div>

    <div id="scoreboard" class="scoreboard"></div>
  </div>

  <!-- MODÁLNÍ OKNO PRO MINIHRY -->
  <div id="minigame-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="minigame-title">Minihra</h2>
      <p id="minigame-desc"></p>
      <div id="minigame-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
